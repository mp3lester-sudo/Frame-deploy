<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Slate — Offline</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    background: #120708;
    color: #f2e9df;
    font-family: system-ui, -apple-system, sans-serif;
    text-align: center;
    padding: 1rem;
  }
  h1 { font-size: 1.125rem; font-weight: 500; margin: 0; }
  p { max-width: 380px; font-size: 0.875rem; color: #ab949a; margin: 0; }
  button {
    background: linear-gradient(135deg, #f3e3b8 0%, #d9b876 32%, #a9863f 68%, #e8cf99 100%);
    color: #2a0f14;
    padding: 0.5rem 1.25rem;
    border-radius: 10px;
    font-weight: 500;
    border: none;
    cursor: pointer;
    font-size: 0.875rem;
  }
</style>
</head>
<body>
  <h1>You're offline.</h1>
  <p>Slate needs a connection to load your recommendations. Reconnect and try again.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
