name: CI

# Runs the same gate this project has always verified manually before
# every commit (tsc --noEmit, eslint, vitest run) automatically on every
# push and PR against main, so a regression needs to be deliberately
# force-pushed past a red check rather than just not remembering to run
# the gate locally. Doesn't run `next build` -- that needs real Supabase/
# TMDB/OpenAI/Stripe credentials this repo's CI doesn't have configured,
# and would fail on missing env vars rather than on an actual code
# problem. tsc/eslint/vitest catch the overwhelming majority of what
# actually breaks here without needing any secrets at all.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Test
        run: npx vitest run
